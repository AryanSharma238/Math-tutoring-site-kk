<aside class="sidebar sidebar-slim" id="sidebar">
  <div class="sidebar-content">
    <a href="{{ url_for('home') }}" class="sidebar-brand-link">
      <img src="{{ url_for('static', filename='images/m2-logo.png') }}" alt="" class="sidebar-logo">
      <span class="sidebar-brand-name">E Math Metrics</span>
    </a>
  </div>
</aside>

<div class="profile-menu" id="profileMenu">
  <button type="button" class="profile-avatar" id="profileAvatarBtn" data-seed="{{ user.id }}">
    {{ (user.name or user.email)[0] | upper }}
  </button>
  <div class="profile-dropdown" id="profileDropdown" hidden>
    <p class="profile-dropdown-name">{{ user.name or user.email }}</p>
    <a href="{{ url_for('settings') }}">Settings</a>
    <a href="{{ url_for('logout') }}">Sign out</a>
  </div>
</div>
