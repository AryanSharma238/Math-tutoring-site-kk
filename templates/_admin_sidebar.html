<aside class="sidebar" id="sidebar">
  <div class="sidebar-content">
    <a href="{{ url_for('home') }}" class="sidebar-brand-link">
      <img src="{{ url_for('static', filename='images/m2-logo.png') }}" alt="M² Channel" class="sidebar-logo">
      <span class="sidebar-brand-name font-display">M<sup>2</sup> Channel</span>
    </a>
    <h3 class="section-label">Students</h3>
    <div class="student-list">
      {% for s in students %}
        <a href="{{ url_for('admin_student', user_id=s.id) }}"
           class="student-link {{ 'active' if (student is defined) and student and student.id == s.id else '' }}">
          {{ s.name or s.email }}
        </a>
      {% else %}
        <p class="muted small">No students signed in yet.</p>
      {% endfor %}
    </div>
  </div>
</aside>

<div class="profile-menu" id="profileMenu">
  {% if class_call_url %}
    <button type="button" class="join-class-btn join-class-btn-compact" id="startClassBtn"
      data-url="{{ class_call_url }}" data-name="{{ user.name or user.email }}">
      Join Call
    </button>
  {% endif %}
  <button type="button" class="profile-avatar" id="profileAvatarBtn" data-seed="{{ user.id }}">
    {{ (user.name or user.email)[0] | upper }}
  </button>
  <div class="profile-dropdown" id="profileDropdown" hidden>
    <p class="profile-dropdown-name">{{ user.name or user.email }}</p>
    <a href="{{ url_for('settings') }}">Settings</a>
    <a href="{{ url_for('logout') }}">Sign out</a>
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const startClassBtn = document.getElementById("startClassBtn");
    if (startClassBtn) {
      startClassBtn.addEventListener("click", () => {
        openClassCall(startClassBtn.dataset.url, startClassBtn.dataset.name);
      });
    }
  });
</script>
