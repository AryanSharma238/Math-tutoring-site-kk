{% extends "base.html" %}
{% block title %}{{ homework.title }}{% endblock %}
{% block body %}
<div class="portal">
  {% include "_student_sidebar.html" %}
  <main class="content content-wide">
    <section class="card homework-view-card">
      <div class="homework-view-head">
        <div>
          <p class="muted small">Homework PDF</p>
          <h1>{{ homework.title }}</h1>
          <p class="muted small">{{ homework.filename }}</p>
        </div>
        <form method="POST" action="{{ url_for('submit_homework', file_id=homework.id) }}">
          <button type="submit" class="join-class-btn">Submit homework</button>
        </form>
      </div>
      <embed src="{{ url_for('serve_homework', file_id=homework.id) }}" type="{{ homework.mimetype }}" class="homework-pdf-viewer">
    </section>
  </main>
</div>
{% endblock %}
