<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Math Tutoring{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/m2-logo.png') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  (function () {
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="flash">
      {% for m in messages %}<div>{{ m }}</div>{% endfor %}
    </div>
  {% endif %}
{% endwith %}
{% block body %}{% endblock %}

<!-- Class call: embedded in-page (not a separate popup/app), present on every page so it
     reappears automatically after navigating -- see openClassCall() in app.js. -->
<div class="call-window" id="callWindow" hidden>
  <div class="call-header" id="callHeader">
    <span class="call-title">Class Call</span>
    <div class="call-header-btns">
      <button type="button" class="call-header-btn" id="closeCallBtn" title="Leave and close">&times;</button>
    </div>
  </div>
  <div class="call-body">
    <iframe id="callFrame" class="call-frame" allow="camera; microphone; display-capture; fullscreen"></iframe>
  </div>
  <div class="call-resize-handle" id="callResizeHandle"></div>
</div>

<!-- Whiteboard launcher: a small pull-tab on the right edge, present on every page. Clicking
     it expands a fullscreen overlay with the live whiteboard; clicking again collapses it.
     Shown/hidden and pointed at the right URL by JS (see initWhiteboardLauncher in app.js),
     since which board to open (a student's own vs. the admin's student picker) and whether to
     show it at all depends on who's logged in, which isn't available in every template. -->
<button type="button" class="wb-launch-tab" id="wbLaunchTab" title="Whiteboard" hidden>Whiteboard</button>
<div class="wb-launch-overlay" id="wbLaunchOverlay" hidden>
  <iframe id="wbLaunchFrame" class="wb-launch-frame"></iframe>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
