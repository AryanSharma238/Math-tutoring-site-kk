{% extends "base.html" %}
{% block title %}{{ quiz.title }}{% endblock %}
{% block body %}
<div class="quiz-take-shell">
  <div class="quiz-take-topbar">
    <a href="{{ url_for('quizzes') }}" class="quiz-take-back" title="Exit quiz">&larr; Exit</a>
    <h1 class="quiz-take-title">{{ quiz.title }}</h1>
    <div class="quiz-nav-dots" id="quizNavDots"></div>
  </div>

  <div class="quiz-take-body" id="quizContainer"></div>

  <div class="quiz-take-controls">
    <button type="button" id="prevBtn" class="secondary-btn">Previous</button>
    <button type="button" id="nextBtn">Next</button>
  </div>
</div>

<div class="quiz-tools-rail">
  <button type="button" id="openCalcBtn" class="tool-fab" title="Calculator">Calculator</button>
  <button type="button" id="openDrawBtn" class="tool-fab" title="Draw">Draw</button>
</div>

<div class="calc-window" id="calcWindow" hidden>
  <div class="calc-header" id="calcHeader">
    <div class="calc-tabs">
      <button type="button" class="calc-tab active" data-tab="graphing">Desmos</button>
      <button type="button" class="calc-tab" data-tab="scientific">Scientific Calculator</button>
    </div>
    <button type="button" class="calc-close" id="closeCalcBtn">&times;</button>
  </div>
  <div class="calc-body">
    <iframe id="calcFrameGraphing" src="https://www.desmos.com/calculator" class="calc-frame active"></iframe>
    <iframe id="calcFrameScientific" src="https://www.desmos.com/scientific" class="calc-frame"></iframe>
  </div>
  <div class="calc-resize-handle" id="calcResizeHandle"></div>
</div>

<div class="draw-overlay" id="drawOverlay" hidden>
  <div class="draw-toolbar">
    <button type="button" class="draw-tool active" data-tool="pen" title="Pen">Pen</button>
    <button type="button" class="draw-tool" data-tool="highlighter" title="Highlighter">Highlighter</button>
    <button type="button" class="draw-tool" data-tool="marker" title="Marker">Marker</button>
    <button type="button" class="draw-tool" data-tool="eraser" title="Eraser">Eraser</button>
    <span class="draw-colors">
      <button type="button" class="draw-color active" data-color="#1a1a2e" style="background:#1a1a2e"></button>
      <button type="button" class="draw-color" data-color="#dc2626" style="background:#dc2626"></button>
      <button type="button" class="draw-color" data-color="#2563eb" style="background:#2563eb"></button>
      <button type="button" class="draw-color" data-color="#16a34a" style="background:#16a34a"></button>
      <button type="button" class="draw-color" data-color="#f59e0b" style="background:#f59e0b"></button>
    </span>
    <button type="button" class="tool-btn" id="closeDrawBtn">Close &amp; clear</button>
  </div>
  <canvas id="drawCanvas"></canvas>
</div>
{% endblock %}
{% block scripts %}
<script>
  const questions = {{ questions | tojson }};
  const savedAnswers = {{ saved_answers | tojson }};
  const quizId = {{ quiz.id }};
  const container = document.getElementById("quizContainer");
  const navDots = document.getElementById("quizNavDots");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  // Free navigation between any question at any time -- start on the first one that isn't
  // already correctly answered, or question 1 if everything's done.
  let currentIndex = questions.findIndex((_, pi) => !(savedAnswers[String(pi)] || {}).submitted);
  if (currentIndex === -1) currentIndex = 0;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function isCorrect(pi) {
    return !!(savedAnswers[String(pi)] || {}).submitted;
  }

  function renderNavDots() {
    navDots.innerHTML = questions
      .map((_, pi) => {
        const cls = ["quiz-nav-dot"];
        if (pi === currentIndex) cls.push("current");
        if (isCorrect(pi)) cls.push("done");
        return `<button type="button" class="${cls.join(" ")}" data-goto="${pi}">${pi + 1}</button>`;
      })
      .join("");
  }

  function renderQuestion() {
    const pi = currentIndex;
    const p = questions[pi];
    const saved = savedAnswers[String(pi)] || {};
    const locked = !!saved.submitted; // locked once answered correctly; wrong answers can retry

    const choicesHtml = (p.choices || [])
      .map((c, ci) => {
        const cls = ["choice-btn"];
        if (locked) {
          if (c.correct) cls.push("correct");
        } else if (saved.choice === ci) {
          cls.push("selected");
        }
        return `
          <button type="button" class="${cls.join(" ")}" data-choice="${ci}" ${locked ? "disabled" : ""}>
            <span class="choice-label">${escapeHtml(c.label || "")}</span>
            ${escapeHtml(c.text || "")}
          </button>
        `;
      })
      .join("");

    container.innerHTML = `
      <div class="quiz-question" data-submitted="${locked ? "true" : "false"}">
        <p class="quiz-question-text"><span class="num">${pi + 1}.</span> ${escapeHtml(p.question || "")}</p>
        ${p.graph ? `<div class="quiz-graph" id="graph-current"></div>` : ""}
        <div class="quiz-choices">${choicesHtml}</div>
        <button type="button" class="submit-answer-btn" id="submitAnswerBtn" ${saved.choice === undefined || locked ? "disabled" : ""} ${locked ? "hidden" : ""}>
          ${saved.wrongAttempt ? "Try again" : "Submit answer"}
        </button>
        <p class="quiz-feedback ${locked ? "correct-text" : saved.wrongAttempt ? "incorrect-text" : ""}" id="feedback">
          ${locked ? "Correct!" : saved.wrongAttempt ? (p.choices[saved.choice] && p.choices[saved.choice].explanation) || "Not quite -- try again." : ""}
        </p>
        <button type="button" class="steps-toggle" id="stepsToggle">Show step-by-step solution</button>
        <div class="steps" id="stepsBox" hidden>${escapeHtml(p.solution || "")}</div>
      </div>
    `;

    if (p.graph) renderGraphIn(document.getElementById("graph-current"), p.graph);
    renderMathIn(container);

    prevBtn.disabled = pi === 0;
    nextBtn.textContent = pi === questions.length - 1 ? "Finish" : "Next";
    renderNavDots();
  }

  function saveAnswer(pi, choiceIndex, submitted) {
    const prev = savedAnswers[String(pi)] || {};
    savedAnswers[String(pi)] = { ...prev, choice: choiceIndex, submitted, wrongAttempt: !submitted };
    fetch(`/quizzes/${quizId}/answer`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question_index: pi, choice_index: choiceIndex, submitted }),
    }).catch(() => {});
  }

  container.addEventListener("click", (e) => {
    const stepsBtn = e.target.closest("#stepsToggle");
    if (stepsBtn) {
      const box = document.getElementById("stepsBox");
      box.hidden = !box.hidden;
      stepsBtn.textContent = box.hidden ? "Show step-by-step solution" : "Hide step-by-step solution";
      return;
    }

    const choiceBtn = e.target.closest(".choice-btn");
    if (choiceBtn && !choiceBtn.disabled) {
      const qEl = container.querySelector(".quiz-question");
      if (qEl.dataset.submitted === "true") return;

      container.querySelectorAll(".choice-btn").forEach((b) => b.classList.remove("selected"));
      choiceBtn.classList.add("selected");
      const submitBtn = document.getElementById("submitAnswerBtn");
      submitBtn.disabled = false;
      submitBtn.hidden = false;

      const ci = parseInt(choiceBtn.dataset.choice, 10);
      savedAnswers[String(currentIndex)] = { choice: ci, submitted: false };
      return;
    }

    const submitBtn = e.target.closest("#submitAnswerBtn");
    if (submitBtn) {
      const selected = container.querySelector(".choice-btn.selected");
      if (!selected) return;
      const ci = parseInt(selected.dataset.choice, 10);
      const correct = !!questions[currentIndex].choices[ci].correct;
      saveAnswer(currentIndex, ci, correct);
      // Retry-until-correct: a wrong answer just re-renders with feedback and stays unlocked
      // so the student can pick again; a correct one locks the question.
      renderQuestion();
    }
  });

  navDots.addEventListener("click", (e) => {
    const dot = e.target.closest(".quiz-nav-dot");
    if (!dot) return;
    currentIndex = parseInt(dot.dataset.goto, 10);
    renderQuestion();
  });

  prevBtn.addEventListener("click", () => {
    if (currentIndex > 0) {
      currentIndex -= 1;
      renderQuestion();
    }
  });

  nextBtn.addEventListener("click", () => {
    if (currentIndex < questions.length - 1) {
      currentIndex += 1;
      renderQuestion();
    } else {
      window.location.href = "{{ url_for('quizzes') }}";
    }
  });

  renderQuestion();

  // ---------- Calculator window (movable + resizable, Desmos graphing/scientific tabs) ----------
  (function () {
    const win = document.getElementById("calcWindow");
    const header = document.getElementById("calcHeader");
    const openBtn = document.getElementById("openCalcBtn");
    const closeBtn = document.getElementById("closeCalcBtn");
    const tabs = win.querySelectorAll(".calc-tab");
    const frames = {
      graphing: document.getElementById("calcFrameGraphing"),
      scientific: document.getElementById("calcFrameScientific"),
    };

    openBtn.addEventListener("click", () => { win.hidden = false; });
    closeBtn.addEventListener("click", () => { win.hidden = true; });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        Object.values(frames).forEach((f) => f.classList.remove("active"));
        frames[tab.dataset.tab].classList.add("active");
      });
    });

    // Drag by header
    let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
    header.addEventListener("mousedown", (e) => {
      if (e.target.closest(".calc-tab") || e.target.closest(".calc-close")) return;
      dragging = true;
      const rect = win.getBoundingClientRect();
      startX = e.clientX; startY = e.clientY;
      startLeft = rect.left; startTop = rect.top;
      win.style.right = "auto";
      win.style.bottom = "auto";
      e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      win.style.left = `${startLeft + (e.clientX - startX)}px`;
      win.style.top = `${startTop + (e.clientY - startY)}px`;
    });
    document.addEventListener("mouseup", () => { dragging = false; });
  })();

  // ---------- Drawing tool overlay ----------
  (function () {
    const overlay = document.getElementById("drawOverlay");
    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    const openBtn = document.getElementById("openDrawBtn");
    const closeBtn = document.getElementById("closeDrawBtn");
    const toolBtns = overlay.querySelectorAll(".draw-tool");
    const colorBtns = overlay.querySelectorAll(".draw-color");

    let tool = "pen";
    let color = "#1a1a2e";
    let drawing = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    openBtn.addEventListener("click", () => {
      overlay.hidden = false;
      resizeCanvas();
    });

    closeBtn.addEventListener("click", () => {
      clearCanvas();
      overlay.hidden = true;
    });

    window.addEventListener("resize", () => {
      if (!overlay.hidden) resizeCanvas();
    });

    toolBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        toolBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        tool = btn.dataset.tool;
      });
    });

    colorBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        colorBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        color = btn.dataset.color;
      });
    });

    function strokeStyleFor(tool) {
      if (tool === "highlighter") return { width: 18, alpha: 0.35 };
      if (tool === "marker") return { width: 10, alpha: 0.85 };
      if (tool === "eraser") return { width: 28, alpha: 1 };
      return { width: 3, alpha: 1 }; // pen
    }

    let lastX = 0, lastY = 0;

    canvas.addEventListener("pointerdown", (e) => {
      drawing = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });
    canvas.addEventListener("pointerup", () => { drawing = false; });
    canvas.addEventListener("pointerleave", () => { drawing = false; });
    canvas.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      const style = strokeStyleFor(tool);
      ctx.globalCompositeOperation = tool === "eraser" ? "destination-out" : "source-over";
      ctx.globalAlpha = style.alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = style.width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(e.clientX, e.clientY);
      ctx.stroke();
      lastX = e.clientX;
      lastY = e.clientY;
    });
  })();
</script>
{% endblock %}
